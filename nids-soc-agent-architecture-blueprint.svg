<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 780" width="100%" height="100%" style="display:block; background:#0d0d0d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
