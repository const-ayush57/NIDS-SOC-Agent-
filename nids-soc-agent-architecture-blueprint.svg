  <rect x="230" y="155" width="920" height="410" rx="3" fill="none" stroke="#666" stroke-width="1.2"></rect>
  <rect x="230" y="155" width="50" height="18" rx="2" fill="#333" stroke="#666" stroke-width="1"></rect>
  <text x="255" y="168" text-anchor="middle" fill="#ccc" font-size="10.5" font-weight="700">loop</text>
  <text x="500" y="170" text-anchor="middle" fill="#999" font-size="10.5">[ReAct iterations — Thought → Action → Observation]</text>

