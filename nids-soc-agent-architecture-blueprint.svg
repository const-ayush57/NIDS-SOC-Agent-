  <text x="248" y="642" text-anchor="middle" fill="#888" font-size="10.5">[Streamlit / app.py] direct watsonx.ai call (bypasses agent)</text>
  <line x1="406" y1="666" x2="94" y2="666" stroke="#777" stroke-width="1.1" marker-end="url(#ahr)"></line>
  <text x="248" y="661" text-anchor="middle" fill="#888" font-size="10.5">Structured markdown report (attack type, MITRE ID, iptables)</text>

