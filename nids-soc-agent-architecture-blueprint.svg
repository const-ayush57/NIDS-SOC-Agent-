  <text x="562" y="269" text-anchor="middle" fill="#d4d4d4" font-size="11">threat_classification = attack_type</text>

  <line x1="720" y1="293" x2="414" y2="293" stroke="#aaa" stroke-width="1.1" marker-end="url(#ahr)"></line>
