  <line x1="716" y1="311" x2="414" y2="311" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ahr)"></line>
  <text x="562" y="306" text-anchor="middle" fill="#d4d4d4" font-size="11">ThreatIntelResult (MITRE tactic, technique, mitigations)</text>

  <line x1="410" y1="342" x2="886" y2="342" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ah)"></line>
  <text x="648" y="336" text-anchor="middle" fill="#d4d4d4" font-size="11">attack_type + source_ip</text>

  <line x1="886" y1="362" x2="414" y2="362" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ahr)"></line>
  <text x="648" y="357" text-anchor="middle" fill="#d4d4d4" font-size="11">FirewallMitigationResult (iptables_script, rule_applied)</text>

  <line x1="410" y1="393" x2="1036" y2="393" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ah)"></line>
  <text x="722" y="387" text-anchor="middle" fill="#d4d4d4" font-size="11">firewall_script (iptables rule)</text>

  <line x1="1040" y1="411" x2="1040" y2="435" stroke="#888" stroke-width="1.1"></line>
  <text x="1100" y="426" fill="#888" font-size="10">check protected IPs / subnets</text>

  <line x1="1036" y1="448" x2="414" y2="448" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ahr)"></line>
  <text x="722" y="443" text-anchor="middle" fill="#d4d4d4" font-size="11">PolicyGuardResult (passed, validated_script / GUARDIAN override)</text>

  <line x1="240" y1="480" x2="406" y2="480" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ah)"></line>
  <text x="324" y="474" text-anchor="middle" fill="#d4d4d4" font-size="11">Prompt: all 4 step outputs → SafeIncidentReport schema</text>

  <line x1="406" y1="500" x2="244" y2="500" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ahr)"></line>
  <text x="324" y="494" text-anchor="middle" fill="#d4d4d4" font-size="11">SafeIncidentReport JSON (incident_id, threat_level, MITRE, firewall, escalation)</text>

  <line x1="240" y1="525" x2="406" y2="525" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ah)"></line>
  <text x="324" y="519" text-anchor="middle" fill="#d4d4d4" font-size="11">Append Observation, ask again (if loop continues)</text>

  <line x1="406" y1="582" x2="244" y2="582" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ahr)"></line>
  <text x="324" y="576" text-anchor="middle" fill="#d4d4d4" font-size="11">Final Answer</text>

  <line x1="236" y1="614" x2="94" y2="614" stroke="#e0e0e0" stroke-width="1.4" marker-end="url(#ahr)"></line>
  <text x="162" y="608" text-anchor="middle" fill="#d4d4d4" font-size="11">Formatted SOC report (threat, MITRE, firewall, escalation)</text>

